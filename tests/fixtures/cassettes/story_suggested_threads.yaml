# The suggested story's conversations (scenarios/harmony-demo/story.yaml,
# REVISION_UNSTRUCTURED.md §10). Keys: agents/keys.py. Representatives count their own
# turns per side; after a send_message the model is called again, so a turn that sends
# ends with a thinking-only step. A consult stops the turn, and the released answer
# opens that side's next turn. The answerer for a side's k-th consult is turn k, a tool
# loop over the org's records (`read_document` takes the `kn:` ids search results carry,
# seed_id("harmony-demo", "knowledge_item", "<org>/<slug>")) ending in a
# CONSULT_OUTPUT_SCHEMA draft; the sharing check of draft rev 1 is step 0.
#
# henderson.northlake: Northlake's representative consults. Its answerer reads the
# public calendar (full until Nov 10) and Raj's reserve-block note, and drafts a yes
# using Wed Nov 4. Quoting list prices commits nothing, so it needs no person, but the
# sharing check fails it (reserve slots aren't in what Northlake shares) and it goes to
# Helen, the default assignee. Once she approves, Northlake proposes $1,410 with results
# by Nov 5. Henderson's representative consults on the go-ahead, which reaches Alex;
# with his yes it confirms, Northlake books and closes, and Henderson closes too.
#
# henderson.ridgeline: Ridgeline asks for the seal material. Henderson's answerer finds
# none in the lab's records, so the question reaches Alex inline; his answer (Kalrez)
# goes back. Ridgeline's answerer quotes from the price list, which is within what
# Ridgeline shares, so it is released without a person: $325. Alex says yes to the
# order, Ridgeline confirms and closes, and Henderson closes too.
#
# henderson.calder: not in the story (Calder is a weak fit and left out), but the
# outreach card lets a visitor include it, so its side is scripted too.
scenario: harmony-demo
