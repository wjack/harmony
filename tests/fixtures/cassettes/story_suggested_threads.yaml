# The suggested story's conversations (scenarios/harmony-demo/story.yaml,
# REVISION_UNSTRUCTURED.md §10). Keys: agents/keys.py. Representatives count their own
# turns per side; after a send_message the model is called again, so a turn that sends
# ends with a thinking-only step. A consult stops the turn, and the released answer
# opens that side's next turn. The answerer for a side's k-th consult is turn k, a tool
# loop over the org's records (`read_document` takes the `kn:` ids search results carry,
# seed_id("harmony-demo", "knowledge_item", "<org>/<slug>")) ending in a
# CONSULT_OUTPUT_SCHEMA draft; the sharing check of draft rev 1 is step 0.
#
# The orgs' records and written authority settle almost everything: one person is
# asked, Alex, to review Northlake's quote.
#
# henderson.northlake: Northlake's representative asks how the coupons are marked, how
# they reach the core, how they'll be held for the CT and how firm Nov 6 is.
# Henderson's representative consults; its answerer has it all in the lab's records, the
# sharing check passes it, and it goes back with no person. Northlake's representative
# consults its side: the answerer quotes both options from the public calendar and the
# published prices (CT first either way, in the Wed Nov 4 morning session; standard
# $1,284, compression Tue Nov 10, reports Fri Nov 13; priority $1,434, the Wed Nov 4
# afternoon block, reports Thu Nov 5), and the sharing check passes it: everything is
# published, and Raj's note about who freed the Nov 4 block stays out. Both options are
# over the $1,000 Henderson's representative may commit alone, so it consults; the
# answerer recommends priority from the lab's dates and spending notes and routes it to
# Alex, who approves it as drafted. Northlake confirms the booking at published prices
# and closes, and Henderson closes too.
#
# henderson.ridgeline: Ridgeline asks which instrument the holder fits and which tube.
# Henderson's answerer finds both in the lab's records (Northlake's Xradia 620 Versa, a
# carbon-fiber tube for high-resolution scans), and the answer goes back with no person.
# Ridgeline's answerer quotes from the price list: $240 + $85 for carbon fiber = $325,
# delivered Mon Nov 2. Henderson's representative accepts on its own (list price,
# within its ask, under $1,000), and Ridgeline confirms at list price and closes;
# Henderson closes too.
#
# henderson.calder: not in the story (Calder is a weak fit, listed but not suggested),
# but the outreach card lets a visitor include it, so its side is scripted too. Its ask
# is a modelling enquiry; Calder says what it could do, that it would need the lattice
# designs to scope it, and closes.
#
# Each answerer's route names who decides with why, addressed to them, and a one-line
# short question for the reviewer.
