# Internal Claude in the suggested story (scenarios/harmony-demo/story.yaml,
# REVISION_UNSTRUCTURED.md §10): Alex's first chat in the world, `chat:alex:1`. Keys:
# src/harmony/agents/keys.py. Tools: agents/tools/internal.py.
#
# Turn 1 runs one search per part of the need (step 0 the testing, step 1 the holder;
# the screener verdicts are story_suggested_screen.yaml), then drafts the brief and
# proposes the recipients, each with its own title and ask (the budget is split
# between the asks, since each representative sees only its own conversation), with
# Calder listed but not suggested: the outreach card pauses the turn at step 2, and it
# resumes at step 3 once Alex approves, saying in one sentence that it's out. The brief
# lets each representative accept a list-price quote within its ask, and leaves the
# holder's instrument and tube to Henderson Frame Lab's records. Turn 2 is woken when the
# request closes (both conversations ended) and sums up in prose.
scenario: harmony-demo
entries:
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 1, step: 0}
    content:
      - type: thinking
        thinking: >-
          Two parts: the testing (CT scans and compression tests on 12 titanium lattice
          coupons by Nov 6) and a holder that stacks the coupons for the CT. Different
          kinds of organization, so one search each, the testing first.
      - type: text
        text: I'll screen the network for each part, starting with the testing.
      - type: tool_use
        name: search_network
        input:
          need: >-
            CT scans and compression tests on 12 3D-printed titanium lattice coupons (20 mm
            cubes), with standard reports by Nov 6. The compression tests crush the
            coupons, so the CT has to come first.
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 1, step: 1}
    content:
      - type: thinking
        thinking: >-
          Northlake is the strong fit for the testing; Bayside and Ostrander only partly
          fit. Now the holder.
      - type: tool_use
        name: search_network
        input:
          need: >-
            A holder that stacks 12 titanium lattice coupons (20 mm cubes) so they go
            through one micro-CT scan session, made to fit the instrument, delivered by
            Nov 3.
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 1, step: 2}
    content:
      - type: thinking
        thinking: >-
          Northlake for the testing and Ridgeline for the holder. Calder came up in both
          searches but only does computation. One brief for all: the coupon class and
          count but not the lattice designs. Each organization's part and its share of
          the budget go in its ask; the representatives may accept list-price quotes
          within them, and anything over $1,000 with one organization comes back to
          Alex.
      - type: text
        text: |-
          Two organizations are strong fits:

          - **Northlake Characterization Core** for the CT and compression tests: a shared-instrument facility with micro-CT and mechanical testing, open to external academic users. Their summary says turnaround is usually 5–10 business days, with priority compression-test blocks for a published fee, so Nov 6 may be possible.
          - **Ridgeline Fabrication** for the holder: they machine instrument holders and test fixtures for labs in 3–5 business days.

          Calder Computational came up too, but it's a weak fit: it does finite-element modelling only, with no lab instruments, so I'd leave it out. Bayside runs compression tests but has no CT, and Ostrander runs micro-CT but is booked through December. Granite machines parts, but only from the customer's own drawings.

          Here's the Harmony Network Request I'd send. The brief shares the coupon class and count, but not the lattice designs or print settings. Each organization gets its own ask, with its share of the budget kept to us: about $1,600 for the testing and $400 for the holder. The representatives may accept list-price quotes within those shares, and will check with you before committing more than $1,000 with any one organization.
      - type: tool_use
        name: send_network_request
        input:
          title: Lattice coupon testing and holder
          brief: |-
            CT and compression tests on 12 lattice coupons by Nov 6, and a CT holder

            Henderson Frame Lab (Dept. of Mechanical Engineering, Northlake University) needs two things:
            - CT scans and compression tests on 12 lattice coupons, 20 mm cubes printed in Ti-6Al-4V titanium, with standard reports by Fri Nov 6. The CT comes first, since the compression tests crush the coupons.
            - A holder that stacks the coupons for the CT, so all 12 go through one scan session, delivered before Tue Nov 3.

            You may tell counterparties the coupon class and count, how the coupons get there, instrument and mounting details, and the dates. Don't share the lattice designs, print settings or any results.

            Ask for quotes with dates. You may accept a quote at list price that fits these dates and the limit in your ask; check with Alex before committing more than $1,000 with any one organization.
          recipients:
            - org: northlake
              reason: >-
                Micro-CT and compression testing in one shared-instrument core; priority
                compression blocks for a published fee.
              title: CT and compression quote
              ask: >-
                CT scans and compression tests on the 12 coupons, with standard reports by
                Fri Nov 6: ask whether they can meet that date, for a quote with dates, and
                how they'd like the coupons delivered. Up to about $1,600 for both tests is
                acceptable; keep that figure to yourself.
              suggested: true
            - org: ridgeline
              reason: >-
                Machines instrument holders and test fixtures for labs in 3–5 business days.
              title: CT holder quote
              ask: >-
                A holder that stacks the 12 coupons for the CT, so they go through one scan
                session, delivered before Tue Nov 3: ask for a quote and a delivery date. Up
                to about $400 is acceptable; keep that figure to yourself.
              suggested: true
            - org: calder
              reason: >-
                Weak fit: finite-element and topology-optimization studies only, with no lab
                instruments. I'd leave it out.
              title: Modelling support enquiry
              ask: >-
                Ask whether modelling could support this lattice work, such as finite-element
                predictions of each design's stiffness and crush strength, and what it would
                involve. It's an enquiry only: don't commit to any work.
              suggested: false
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 1, step: 3}
    content:
      - type: text
        text: >-
          It's out to Northlake Characterization Core and Ridgeline Fabrication; their
          progress shows on the request's card.
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 2, step: 0}
    content:
      - type: thinking
        thinking: Both conversations have closed. Check the request status for how they ended.
      - type: text
        text: Both conversations have closed. Let me check where they ended up.
      - type: tool_use
        name: get_request_status
        input: {}
  - match: {org: henderson, role: internal, thread: "chat:alex:1", turn: 2, step: 1}
    content:
      - type: thinking
        thinking: >-
          $1,434 + $325 = $1,759, inside the ~$2,000 budget. The holder reaches the core
          on Nov 2, before the CT session on Nov 4.
      - type: text
        text: |-
          Both are done, and together they cover the whole request:

          - **Northlake Characterization Core** booked the CT in its Wed Nov 4 morning session and the compression tests in a priority block that afternoon, for **$1,434** at their published academic prices (a 10% volume discount on each test, plus the $150 priority fee). Compression reports come by Thu Nov 5 and CT reports by Fri Nov 6. You chose priority over the $1,284 standard option. The 12 coupons go to the core's front desk by Tue Nov 3.
          - **Ridgeline Fabrication** is making the stacked CT holder for the core's Xradia 620 Versa with a carbon-fiber tube for **$325**. It's delivered to the core on Mon Nov 2, in time for the CT.

          That's **$1,759** in total, inside your $2,000 budget.
