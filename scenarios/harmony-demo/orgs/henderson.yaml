# Henderson Frame Lab, the requester (docs/SCENARIO.md).
# Its records answer what the counterparties are likely to ask (how the coupons reach
# the core, which instrument the holder fits and its tube, how firm the dates are), and
# its instructions let the representative accept a list-price quote on its own up to
# $1,000 per organization. Above that, the lab reviews the order: in the story,
# Northlake's quote is the one review.
slug: henderson
name: Henderson Frame Lab
kind: research
featured: true
communities: [northlake-university]

members:
  - slug: alex
    name: Alex Chen
    title: PhD student
    role: admin
    profile: >-
      Designs and prints the lattice coupons and owns test logistics. Decides on his own
      requests for external services within the lab's discretionary budget (about
      $2,000 a month), and reviews any single order over $1,000 on them.
  - slug: maya
    name: Prof. Maya Henderson
    title: Principal investigator
    role: admin
    profile: >-
      Decides on spending above the discretionary budget, contracts and external
      collaborations.

settings:
  public_summary: >-
    Henderson Frame Lab, Dept. of Mechanical Engineering, Northlake University, designs
    3D-printed titanium lattices for lighter bike frames in the Pacific Northwest. On
    Harmony we mostly request services (testing, CT scanning and fabrication), and we
    can provide metal 3D-printing time on request.
  instructions: >-
    You represent Henderson Frame Lab to other organizations. Your brief says what the lab
    needs and what you may tell counterparties. Get quotes with dates. You may accept a
    quote at list price (published discounts and fees included) that fits the brief's
    dates and the lab's budget. Before committing more than $1,000 with one
    organization, consult the lab, and consult it whenever a counterparty asks
    something the brief doesn't answer. Never guess on the lab's behalf. Once an
    order is agreed, confirm it and close: don't raise questions the brief doesn't
    need answered. The lab's
    answer to a consult on an order over $1,000 accepts one option in so many words,
    the one the dates and the budget favor, so Alex can approve it as written; once
    it's released, act on it.

policy:
  autonomy: auto
  sharing_description: >-
    The coupon class and count, how the coupons get to the core, instrument and
    mounting details, dates, the lab's shipping address and our contact email, and
    which of a counterparty's quoted options we accept, at its price. Not: lattice
    designs, print settings, unpublished results or the lab's budget.
  routing_prompt: >-
    Questions about coupons and logistics, go-aheads on a member's own request within
    the lab's discretionary budget, and reviews of orders over $1,000 on it go to that
    member (Alex for his requests). Spending above the budget, contracts and
    collaborations go to Maya.
  default_assignee: alex

knowledge:
  - slug: about
    title: About Henderson Frame Lab
    kind: profile
    body: >-
      Henderson Frame Lab (Dept. of Mechanical Engineering, Northlake University) designs
      3D-printed titanium lattices for lighter bike frames.
  - slug: lab-profile
    title: Lab profile
    kind: profile
    body: >-
      Henderson Frame Lab, Dept. of Mechanical Engineering, Northlake University; PI Prof.
      Maya Henderson. Research on 3D-printed titanium lattice structures for lighter
      bike frames. Metal 3D-printing time available on request. Shipping address:
      Henderson Frame Lab, Mechanical Engineering, Northlake campus.
  - slug: project-ltc-12
    title: Project LTC-12
    kind: project
    author: alex
    body: >-
      12 lattice coupons, 20 mm cubes printed in Ti-6Al-4V titanium in October 2026:
      four lattice designs, three coupons of each. We want each design's print defects
      from CT, then its stiffness and crush strength from compression tests.
  - slug: coupons
    title: LTC-12 coupons and drop-off
    kind: note
    author: alex
    body: >-
      The 12 LTC-12 coupons are 20 mm titanium cubes, each engraved with its ID. We and
      the characterization core are both on Northlake campus, so we drop them off at the
      core's front desk ourselves: no courier. They're ready now, and we can bring them
      any weekday, as early as the core needs them. Contact:
      alex.chen@henderson-lab.example.
  - slug: ct-holder
    title: LTC-12 CT holder
    kind: note
    author: alex
    body: >-
      We have no holder that stacks coupons for CT. We need one stacked holder for the
      characterization core's Zeiss Xradia 620 Versa, with a carbon-fiber tube, because
      we need high-resolution scans to see strut defects, delivered to the core's front
      desk: Room 112, Engineering Hall, Northlake campus. One holder is enough: it carries
      all 12 coupons through one scan session. A listed holder that fits the Versa is
      what we want, not a custom design, so we have no drawings or dimensions of our
      own. The compression tests need nothing from us: the core tests the coupons
      between its own platens.
  - slug: dates
    title: LTC-12 dates
    kind: schedule
    author: alex
    body: >-
      The goal is CT and compression results by Fri Nov 6, for the group meeting on Mon
      Nov 9. Results by Fri Nov 13 still work, for the quarterly report. Making Nov 6 is
      worth up to about $200 extra.
  - slug: lattice-designs
    title: Lattice designs
    kind: note
    author: alex
    body: >-
      Cell sizes, strut thicknesses and print settings for each LTC-12 design.
      Unpublished; do not share outside the lab.
  - slug: budget
    title: Spending
    kind: budget
    body: >-
      About $2,000 discretionary this month for external testing and parts.
      Alex reviews any single order over $1,000 before it's placed; below that, our
      representative accepts list-price orders on its own, without asking anyone. Members decide on their own requests
      within the budget; Maya decides on anything above.
