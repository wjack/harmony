# Henderson Lab, the requester (docs/SCENARIO.md).
# Its records answer what the counterparties are likely to ask (how the samples arrive,
# which instrument the holder fits and its seal, how firm the dates are), and its
# instructions let the representative accept a list-price quote on its own up to
# $1,000 per organization. Above that, the lab reviews the order: in the story,
# Northlake's quote is the one review.
slug: henderson
name: Henderson Lab
kind: research
featured: true
communities: [northlake-university]

members:
  - slug: alex
    name: Alex Chen
    title: PhD student
    role: admin
    profile: >-
      Runs the Na-ion cathode synthesis and owns sample logistics. Decides on his own
      requests for external services within the lab's discretionary budget (about
      $2,000 a month), and reviews any single order over $1,000 on them.
  - slug: maya
    name: Prof. Maya Henderson
    title: Principal investigator
    role: admin
    profile: >-
      Decides on spending above the discretionary budget, contracts and external
      collaborations.

settings:
  public_summary: >-
    Henderson Lab, Dept. of Materials Science, Northlake University, researches
    sodium-ion cathodes made from Earth-abundant elements in the Pacific Northwest. On
    Harmony we mostly request services (characterization, fabrication and compute),
    and we can provide coin-cell cycling capacity on request.
  instructions: >-
    You represent Henderson Lab to other organizations. Your brief says what the lab
    needs and what you may tell counterparties. Get quotes with dates. You may accept a
    quote at list price (published discounts and fees included) that fits the brief's
    dates and the lab's budget. Before committing more than $1,000 with one
    organization, consult the lab, and consult it whenever a counterparty asks
    something the brief doesn't answer. Never guess on the lab's behalf. The lab's
    answer to a consult on an order over $1,000 accepts one option in so many words,
    the one the dates and the budget favor, so Alex can approve it as written; once
    it's released, act on it.

policy:
  autonomy: auto
  sharing_description: >-
    The sample class and count, that samples are air-sensitive and how they are
    packed, delivered and handled, instrument and mounting details, dates, the lab's
    shipping address and our contact email. Not: compositions, dopant fractions,
    unpublished results or the lab's budget.
  routing_prompt: >-
    Questions about samples and logistics, go-aheads on a member's own request within
    the lab's discretionary budget, and reviews of orders over $1,000 on it go to that
    member (Alex for his requests). Spending above the budget, contracts and
    collaborations go to Maya.
  default_assignee: alex

knowledge:
  - slug: about
    title: About Henderson Lab
    kind: profile
    body: >-
      Henderson Lab (Dept. of Materials Science, Northlake University) researches
      sodium-ion cathodes made from Earth-abundant elements.
  - slug: lab-profile
    title: Lab profile
    kind: profile
    body: >-
      Henderson Lab, Dept. of Materials Science, Northlake University; PI Prof. Maya
      Henderson. Battery materials research on sodium-ion cathodes from Earth-abundant
      elements. Coin-cell cycling capacity available on request. Shipping address:
      Henderson Lab, Bldg 4, Northlake campus.
  - slug: project-nac-12
    title: Project NAC-12
    kind: project
    author: alex
    body: >-
      12 layered-oxide cathode powders in the NaₓMnₐFe_bNi_cO₂ family, synthesized in
      October 2026 and stored in an Ar glovebox. Air-sensitive: moisture uptake within
      minutes of exposure.
  - slug: samples-handling
    title: NAC-12 samples and handling
    kind: note
    author: alex
    body: >-
      The 12 NAC-12 powders, about 150 mg each, are in crimp-sealed glass vials under
      argon. We and the characterization core are both on Northlake campus, so Alex
      walks the sealed vials over to the core himself: no courier. They're ready now,
      and he can bring them any weekday, as early as the core needs them. Contact:
      alex.chen@henderson-lab.example.
  - slug: transfer-holder
    title: NAC-12 transfer holder
    kind: note
    author: alex
    body: >-
      We have no sealed holder for SEM. We need one standard transfer holder for the
      characterization core's Thermo Fisher Apreo 2 airlock, with a Kalrez seal,
      because the powders may sit in it under argon for weeks, delivered to the core.
      One holder is enough: the core mounts all 12 powders on carbon tape on one SEM
      stub in its glovebox, and the holder carries that stub into the airlock. A listed
      holder that fits the Apreo 2 is what we want, not a custom design, so we have no
      drawings or dimensions of our own. XRD needs no holder from us: the core loads
      the powders into its own air-free dome holders.
  - slug: dates
    title: NAC-12 dates
    kind: schedule
    author: alex
    body: >-
      The goal is XRD and SEM/EDS results by Fri Nov 6, for the group meeting on Mon
      Nov 9. Results by Fri Nov 13 still work, for the quarterly report. Making Nov 6 is
      worth up to about $200 extra.
  - slug: dopant-compositions
    title: Dopant compositions
    kind: note
    author: alex
    body: >-
      Exact Mg/Ti dopant fractions for each NAC-12 sample. Unpublished; do not share
      outside the lab.
  - slug: budget
    title: Spending
    kind: budget
    body: >-
      About $2,000 discretionary this month for external characterization and parts.
      Alex reviews any single order over $1,000 before it's placed; below that, our
      representative may go ahead at list price. Members decide on their own requests
      within the budget; Maya decides on anything above.
