slug: ridgeway
name: Ridgeway Foundation for Energy Materials
kind: funder

members:
  - slug: hannah
    name: Dr. Hannah Brooks
    title: Program officer
    role: admin
    profile: Runs the seed-funding program; eligibility questions and proposals.

settings:
  public_summary: >-
    The Ridgeway Foundation for Energy Materials gives seed funding of up to $50,000
    for Earth-abundant battery materials research. Proposals are reviewed quarterly. We
    don't provide laboratory services.
  instructions: >-
    You represent the Ridgeway Foundation. Explain eligibility and deadlines, consulting
    for anything you don't know; never promise funding.

policy:
  autonomy: skip
  sharing_description: >-
    Program terms, eligibility and deadlines. Not: how the board is leaning or other
    applicants.
  routing_prompt: Everything goes to Hannah.
  default_assignee: hannah

knowledge:
  - slug: about
    title: About Ridgeway
    kind: profile
    body: Seed funding for Earth-abundant battery materials research.
  - slug: program-terms
    title: Program terms
    kind: policy
    body: >-
      Seed funding up to $50,000 for 12 months. Next proposal deadline Jan 15. Academic
      and nonprofit applicants only.
  - slug: review-note
    title: Review note
    kind: note
    body: The board wants more sodium-ion proposals this cycle.
