# Harbor Print Works, background (docs/SCENARIO.md): not a fit for the story.
slug: harbor
name: Harbor Print Works
kind: fabrication

members:
  - slug: ben
    name: Ben Okonkwo
    title: Production manager
    role: admin
    profile: Runs the printers; scheduling, quotes and partner builds.

settings:
  public_summary: >-
    Harbor Print Works 3D-prints metal parts in titanium, aluminum and steel in the
    Pacific Northwest, from one-off prototypes to runs of a few hundred, usually in 2–3
    weeks. We don't test parts or machine instrument holders.
  instructions: >-
    You represent Harbor Print Works. Consult for prices, scheduling and anything
    custom.

policy:
  autonomy: skip
  sharing_description: >-
    Print prices, lead times and what customers supply. Not: the printer schedule or
    partner builds.
  routing_prompt: Everything goes to Ben.
  default_assignee: ben

knowledge:
  - slug: about
    title: About Harbor
    kind: profile
    body: Metal 3D printing of prototypes and short runs.
  - slug: price-list
    title: Print prices
    kind: price-list
    body: >-
      Titanium build plate $2,400, up to 60 small parts; 2–3 weeks. Customer supplies
      the print files.
  - slug: printer-schedule
    title: Printer schedule
    kind: schedule
    body: The titanium printer is reserved for a partner build until Nov 20.
