# Northlake Characterization Core, the main responder (docs/SCENARIO.md).
# Everything it quotes is published: the price list with its volume discount and
# priority fee, and the public calendar with both the standard and the priority XRD
# block. So its answer to Henderson Lab passes the sharing check and nobody is asked.
# Raj's note says why the Nov 4 block is open (another client released it); the
# sharing description keeps other clients out of every answer, so the note never
# reaches the representative.
#
# The public calendar also says SEM is unavailable on Thursday afternoons through
# December (ARCHITECTURE.md §2.1, §11.6). Who books those afternoons is in the
# client-voltaic record, which the sharing description keeps out of every answer.
slug: northlake
name: Northlake Characterization Core
kind: characterization
featured: true
communities: [northlake-university]

members:
  - slug: helen
    name: Dr. Helen Ward
    title: Core director
    role: admin
    profile: >-
      Runs scheduling, off-list pricing exceptions and external contracts. Default
      assignee.
  - slug: raj
    name: Raj Patel
    title: Staff scientist, XRD and SEM
    role: admin
    profile: Runs the instruments; sample prep and air-free handling questions.

settings:
  public_summary: >-
    Northlake Characterization Core is a shared-instrument facility at Northlake
    University, open to external academic and industry users: powder XRD (Bruker D8,
    with air-free dome holders), SEM with EDS (Thermo Apreo 2) and XPS. Typical
    turnaround is 5–10 business days, with priority XRD blocks for a published fee. We
    don't do synthesis, sample shipping or data interpretation beyond standard reports.
  instructions: >-
    You represent the Northlake Characterization Core to external users. Consult the
    core for prices, availability and anything else you don't know; never guess. Once
    your side has told you a slot is open, you may confirm a booking at published
    prices (discounts and the priority fee included). Never discuss other clients or
    their bookings.

policy:
  autonomy: auto
  sharing_description: >-
    Our external academic price list with its published fees and terms, what is open
    on the public instrument calendar and how booking works, the customer's own quote
    and booking, sample-prep, air-free handling and delivery requirements (our
    glovebox, who receives deliveries, what we supply, and which holders fit our
    instruments, Ridgeline's included), and typical turnaround. Not: other clients or
    their bookings, staff notes, or off-list pricing.
  routing_prompt: >-
    Instrument scheduling and off-list pricing exceptions go to Helen. Sample-prep and
    air-free handling questions go to Raj. Anything over $5,000 needs Helen.
  default_assignee: helen

# An example of the Trusted organizations list. Ridgeline machines transfer holders
# for our SEM, so it may also hear the Apreo 2 airlock's dimensions; its mode is the
# default.
trusted_organizations:
  - org: ridgeline
    sharing_description: >-
      Our Apreo 2 airlock dimensions and holder O-ring requirements, so they can
      machine transfer holders that fit our SEM.

knowledge:
  - slug: facility-overview
    title: Facility overview
    kind: profile
    body: >-
      Shared-instrument facility at Northlake University: powder XRD, SEM with EDS and
      XPS, open to external academic and industry users.
  - slug: price-list
    title: Price list, external academic
    kind: price-list
    body: >-
      Powder XRD $45 per sample. SEM/EDS $60 per sample. Air-free transfer and handling
      $150 flat per batch: one fee for samples delivered together, whatever the
      techniques. Standard report included. Published terms for academic
      users: 10 or more samples on one technique get 10% off that technique, applied
      automatically, and a priority XRD block is a $150 flat fee. Quotes valid 14 days.
  - slug: public-calendar
    title: Public calendar
    kind: schedule
    body: >-
      Next standard XRD block: Tue Nov 10, with reports by Fri Nov 13. Priority XRD
      block open: Wed Nov 4, 09:00–13:00, for up to 14 powders, with reports by Thu
      Nov 5. SEM/EDS open from Tue Nov 3, except Thursday afternoons through December:
      sessions run 09:00–13:00 and 13:00–17:00, each taking up to 16 powders on one
      stub, with reports two business days after it (a session on Wed Nov 4 reports by
      Fri Nov 6). We don't hold slots: a customer who accepts a quote is booked into
      its open slots.
  - slug: air-free-handling
    title: Air-free handling, XRD
    kind: procedure
    body: >-
      We load air-sensitive powders into our own air-free dome holders in our
      glovebox, at no extra charge: customers bring no XRD holders. The dome holders
      seal with Viton or Kalrez O-rings. Customers deliver samples sealed under Ar.
  - slug: sem-air-free
    title: SEM/EDS on air-sensitive powders
    kind: procedure
    body: >-
      We mount air-sensitive powders on carbon tape in the glovebox and move them to
      the Apreo 2 in a sealed transfer holder that fits its airlock. We don't supply
      holders; Ridgeline Fabrication's listed Apreo 2 holder fits as delivered. Vials
      hand-delivered on campus are opened in our glovebox.
  - slug: glovebox-receiving
    title: Glovebox and receiving
    kind: procedure
    body: >-
      Our glovebox runs on argon, with O2 and H2O held below 0.5 ppm and logged
      continuously. Air-sensitive samples stay under argon from receipt to
      measurement: vials are opened only in the glovebox, XRD runs in sealed dome
      holders, and SEM stubs go to the Apreo 2 in a sealed transfer holder. Hand
      deliveries on campus: Room 112, Physical Sciences Building, weekdays 9:00–17:00,
      for Raj. Samples for a session must be in by 17:00 the business day before.
  - slug: apreo-airlock
    title: Apreo 2 airlock, holder fit
    kind: spec
    body: >-
      Transfer holders for the Apreo 2 airlock: KF40 port, body at most 50 mm across
      and 30 mm tall, one 2-030 O-ring on the lid.
  - slug: nov-4-xrd-block
    title: Raj's note, Nov 4 XRD block
    kind: note
    author: raj
    body: The Nov 4 block was held for Voltaic's re-run; they released it Friday.
  - slug: client-voltaic
    title: "Client: Voltaic Motors"
    kind: client
    body: >-
      Standing SEM booking every Thursday afternoon through December. Under NDA; never
      discuss.
  - slug: pricing-policy
    title: Pricing policy
    kind: policy
    body: >-
      Academic users pay the external academic list price with its published terms:
      the volume discount and the priority fee. Industry users pay +20% for priority
      blocks. Helen decides only off-list exceptions.
