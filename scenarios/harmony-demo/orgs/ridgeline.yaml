# Ridgeline Fabrication, a responder (docs/SCENARIO.md). It needs the instrument and the
# tube material before it quotes a holder; Henderson Frame Lab's records have both. Its price
# list has the holder the story needs, so it quotes and confirms the order at list
# price without asking anyone.
slug: ridgeline
name: Ridgeline Fabrication
kind: fabrication
featured: true

members:
  - slug: dana
    name: Dana Okafor
    title: Operations lead
    role: admin
    profile: Quotes, scheduling and everything else.

settings:
  public_summary: >-
    Ridgeline Fabrication does precision machining for labs: listed holders for
    common instruments, stacked micro-CT holders included, plus test fixtures and
    custom mounts, usually in 3–5 business days. To quote a holder we need drawings or
    the instrument model, and the material.
  instructions: >-
    You represent Ridgeline Fabrication. Before quoting a holder, make sure you have
    drawings or the instrument model, and the material. Consult the shop for prices
    and lead times. You may confirm an order at list price, the published rush
    included; consult only for work that isn't on the price list.

policy:
  autonomy: auto
  sharing_description: >-
    Our price list (prices, tube options, lead times, the rush and delivery), the
    ready and delivery dates it gives an order, whether the rush is open, which
    instruments our listed holders fit and what they carry, how an order fits the
    dates and budget the customer gave us, and what we need to quote a part. Not:
    other customers, or what else the shop is working on.
  routing_prompt: Everything goes to Dana.
  default_assignee: dana

knowledge:
  - slug: about
    title: About Ridgeline
    kind: profile
    body: Precision machining for labs; we need drawings or the instrument model to quote.
  - slug: price-list
    title: Price list
    kind: price-list
    body: >-
      StackMount CT holder for the Zeiss Xradia 620 Versa, which fits the Versa's stage
      as delivered and carries up to 16 coupons up to 20 mm across in one scan session:
      $240, ready in 4 business days, aluminum tube included. Carbon-fiber tube in its
      place +$85, recommended for high-resolution scans. Free delivery to any front desk
      on Northlake campus the next business day after it's ready. Rush: ready in 3
      business days for +$60. Other holders and fixtures are quoted from drawings.
  - slug: shop-load
    title: Shop load
    kind: note
    body: The lathe is free this week; we can do 3 days if asked.
