# Ridgeline Fabrication, a responder (docs/SCENARIO.md). It needs the instrument and the
# seal material before it quotes an airtight part; Henderson Lab's records have both.
# Its price list has the holder the story needs, so it quotes and confirms the order at
# list price without asking anyone.
slug: ridgeline
name: Ridgeline Fabrication
kind: fabrication
featured: true

members:
  - slug: dana
    name: Dana Okafor
    title: Operations lead
    role: admin
    profile: Quotes, scheduling and everything else.

settings:
  public_summary: >-
    Ridgeline Fabrication does precision machining for labs: vacuum and airtight sample
    holders, transfer vessels and custom fixtures, usually in 3–5 business days. To
    quote an airtight part we need drawings or the instrument model, and the seal
    material.
  instructions: >-
    You represent Ridgeline Fabrication. Before quoting an airtight part, make sure you
    have drawings or the instrument model, and the seal material. Consult the shop for
    prices and lead times. You may confirm an order at list price, the published rush
    included; consult only for work that isn't on the price list.

policy:
  autonomy: auto
  sharing_description: >-
    Prices, seal options, lead times and delivery from our price list, and what we
    need to quote a part. Not: the shop's workload or other customers.
  routing_prompt: Everything goes to Dana.
  default_assignee: dana

knowledge:
  - slug: about
    title: About Ridgeline
    kind: profile
    body: Precision machining for labs; we need drawings or the instrument model to quote.
  - slug: price-list
    title: Price list
    kind: price-list
    body: >-
      Sealed SEM transfer holder for the Thermo Fisher Apreo 2 airlock, aluminum body,
      carries one standard SEM stub (any number of powder mounts on it): $240, ready in
      4 business days, Viton seal included. Kalrez seal in its place
      +$85, recommended for long storage under argon. Free delivery on Northlake campus
      the next business day after it's ready. Rush: ready in 3 business days for +$60,
      when the lathe is free. Other holders and fixtures are quoted from drawings.
  - slug: shop-load
    title: Shop load
    kind: note
    body: The lathe is free this week; we can do 3 days if asked.
