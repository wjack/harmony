# Lumen Data Commons, background (docs/SCENARIO.md): a data holder; not a fit for the
# story.
slug: lumen
name: Lumen Data Commons
kind: data

members:
  - slug: sam
    name: Sam Whitaker
    title: Data curator
    role: admin
    profile: Curates the datasets; access requests and licensing.

settings:
  public_summary: >-
    Lumen Data Commons curates CT scans and mechanical-test datasets for printed
    lattices, licensed for research use, with access usually the same day. We don't
    run measurements.
  instructions: >-
    You represent Lumen Data Commons. Consult for which datasets we hold and their
    licensing terms.

policy:
  autonomy: skip
  sharing_description: >-
    Which datasets we hold and their licensing terms. Not: embargoed datasets.
  routing_prompt: Everything goes to Sam.
  default_assignee: sam

knowledge:
  - slug: about
    title: About Lumen
    kind: profile
    body: Curated CT and mechanical-test datasets for printed lattices.
  - slug: price-list
    title: Licensing
    kind: price-list
    body: Academic research license $0; commercial license $1,500 per dataset per year.
  - slug: embargo-note
    title: Embargo note
    kind: note
    body: Two gyroid-lattice test sets are embargoed until their papers publish.
