slug: bayside
name: Bayside Analytical
kind: characterization

members:
  - slug: grace
    name: Grace Lindqvist
    title: Lab manager
    role: admin
    profile: Runs the lab; quotes, scheduling and client contracts.

settings:
  public_summary: >-
    Bayside Analytical is a commercial testing lab in the Bay Area for industry and
    academic clients: tensile, compression and hardness testing, usually in 5 business
    days. We have no CT and no SEM.
  instructions: >-
    You represent Bayside Analytical. Be clear that we do mechanical testing only, with
    no CT. Consult for prices, scheduling and rush work.

policy:
  autonomy: skip
  sharing_description: >-
    Our price list, turnaround and what parts we can test. Not: instrument maintenance
    or other clients.
  routing_prompt: Everything goes to Grace.
  default_assignee: grace

knowledge:
  - slug: about
    title: About Bayside
    kind: profile
    body: Commercial tensile, compression and hardness testing; no CT.
  - slug: price-list
    title: Price list
    kind: price-list
    body: >-
      Tensile test $70 per specimen. Compression test $55 per part. Hardness $25 per
      part. Standard report included; 5 business days.
  - slug: frame-maintenance
    title: Load frame maintenance
    kind: note
    body: The 100 kN frame is due for calibration mid-November; book compression jobs before Nov 13.
