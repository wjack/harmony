# The suggested story (docs/SCENARIO.md, REVISION_UNSTRUCTURED.md §10). Format:
# StorySpec in src/harmony/seeds/schema.py.
#
# A suggestion, not a script: nothing here forces what Claude does, and in the hosted
# demo live models play every side, so the step bodies say what is likely ("for
# example", "likely") and never state an outcome as fact. It holds
# - the suggestion chip and the network view's suggested recipients;
# - the walkthrough's steps (GET /api/demo/story), each with the beat that shows it
#   happened (`expect`), which `harmony run` checks and P1's live runs count;
# - what `harmony run` does where a person would act (`humans`).
#
# The orgs' records and written authority settle the request between their Claudes:
# on the main path a person is asked only to approve the outreach and to review
# Northlake's quote, which is over the $1,000 Henderson Frame Lab's representative may
# commit alone.
#
# The ScriptedModel cassettes that play this story are
# tests/fixtures/cassettes/story_suggested_*.yaml.
name: suggested
# Who sends the suggested message.
as: alex
# `{+11d}` counts from the scenario's anchor, so it is always Friday Nov 6 on the world
# calendar, like the seeds' own dates (Northlake's Nov 4 and Nov 10). The budget is
# what the lab has this month (Henderson's Spending record); Claude splits it between
# the asks, which is the limit each representative accepts quotes within.
suggested_message: >-
  Find a lab that can CT-scan and compression-test 12 titanium lattice coupons by
  {+11d}, and get a holder made that stacks them for the CT. Budget is about $2,000.
# Ringed and tagged "Suggested" in the network view. Calder is the near miss: it does
# computation only, so it is screened as a weak fit and left out of the outreach.
suggested_recipients: [northlake, ridgeline, calder]
# Who's on the network, shown in "What's on screen" over every org's monogram.
network: >-
  Lighter bike frames: a university lab with new 3D-printed titanium lattices to test,
  the instrument cores that scan and test them, shops that print, treat and machine
  parts, and the suppliers, testers, data and modeling groups, funder and broker
  around them.

steps:
  - id: ask
    title: Ask Claude
    act_as: alex
    body: >-
      As Alex Chen, a PhD student in the Henderson Frame Lab, send the suggested message.
      Claude will likely search the network, screen the organizations it finds and draft
      a brief for the ones that look like a fit.
  - id: approve-outreach
    title: Approve the outreach
    act_as: alex
    body: >-
      Read the brief and each organization's ask: the shared brief gives the coupon
      class and count, and each ask holds that organization's part and its limit. Edit
      either if you like. A near miss, for example Calder (computation only), is likely
      listed as a weak fit and left unticked.
    expect: {beat: outreach_approved}
  - id: records-answer
    title: Let the records answer
    act_as: alex
    body: >-
      Ridgeline will likely ask which instrument the holder must fit and which tube to
      use, and Northlake how the coupons arrive and how firm {+11d} is. Henderson Frame Lab's
      Claude can likely answer each from the lab's records, within what the lab shares,
      without asking you. Ridgeline's quote is likely about $325 at its list prices,
      which the representative may accept on its own, so that conversation can close
      with nobody asked.
    expect: {beat: closed, orgs: [ridgeline]}
  - id: review-quote
    title: Review Northlake's quote
    act_as: alex
    done_on: needs_human
    body: >-
      Northlake will likely quote two options from its published prices: about $1,284
      with reports by Fri Nov 13, or about $1,434 for a priority compression block on
      Wed Nov 4 with reports by Thu Nov 5. Either is over the $1,000 Henderson Frame Lab's
      representative may commit alone, so it will likely ask you in the chat which to
      book.
    expect: {beat: inline_question, org: northlake, member: alex}
  - id: review-answer
    title: Answer the review
    act_as: alex
    body: >-
      Henderson Frame Lab's Claude likely drafts a recommendation from the lab's records, for
      example priority, since $150 is within what the lab set aside to make the Nov 9
      group meeting. Answer, for example, "Yes, take priority", or pick the standard
      option. The representative then likely confirms with Northlake.
    expect: {beat: resolved, org: henderson, member: alex, action: approve}
  - id: closed
    title: Both conversations close
    act_as: alex
    body: >-
      Once Northlake confirms, each side closes with a summary for its own
      organization, and Claude sums up in the chat: about $1,759 in total with priority
      if the quotes match the list prices, inside your budget. The network view shows
      the closed conversations, and Calder as Screened if it was left out.
    expect: {beat: closed, orgs: [northlake, ridgeline]}
  - id: what-it-saw
    title: See what Northlake's representative saw
    act_as: helen
    body: >-
      Open the request from the sidebar, then Details → What our representative saw:
      Northlake's summary, instructions and sharing description, and the answer its side
      released. Raj's note says which client freed the Nov 4 block; it never reached the
      representative, whose answer came from the public calendar. Customize →
      Harmony → Sharing is where you'd change what Northlake shares.
  - id: vantage-probe
    title: See a probe stopped
    act_as: helen
    body: >-
      Off the main path, Vantage, a sourcing firm, may be asking Northlake who books its
      Thursday CT afternoons. If Northlake's Claude drafts an answer that hints at that
      client, the sharing check will likely stop it, and it waits for you under Needs
      you.
  - id: big-run
    title: Switch to the big run
    body: Open the network view and switch it to the big run.

# What `harmony run` does in place of people (unless --interactive). A rule matches an
# escalation of `org` (the side that must decide), optionally only with `counterparty`,
# whoever it reached; `as` is who the story expects it to reach. Rules are used in
# order, each for one escalation. `text` replaces the draft's answer; without it the
# draft goes out as written. An escalation no rule is left for is approved as drafted.
#
# The story's one review: Alex approves the answerer's recommendation as drafted.
humans:
  - org: henderson
    counterparty: northlake
    as: alex
