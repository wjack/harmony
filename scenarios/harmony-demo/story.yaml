# The suggested story (docs/SCENARIO.md, REVISION_UNSTRUCTURED.md §10). Format:
# StorySpec in src/harmony/seeds/schema.py.
#
# A suggestion, not a script: nothing here forces what Claude does, and in the hosted
# demo live models play every side, so the step bodies say what is likely ("for
# example", "likely") and never state an outcome as fact. It holds
# - the suggestion chip and the network view's suggested recipients;
# - the walkthrough's steps (GET /api/demo/story), each with the beat that shows it
#   happened (`expect`), which `harmony run` checks and P1's live runs count;
# - what `harmony run` does where a person would act (`humans`).
#
# The ScriptedModel cassettes that play this story are
# tests/fixtures/cassettes/story_suggested_*.yaml.
name: suggested
# Who sends the suggested message.
as: alex
# `{+11d}` counts from the scenario's anchor, so it is always Friday Nov 6 on the world
# calendar, like the seeds' own dates (Northlake's Nov 10, Raj's Nov 4).
suggested_message: >-
  Find a lab that can run XRD and SEM/EDS on 12 air-sensitive sodium-ion cathode
  powders by {+11d}, and get an airtight sample holder made for the transfer. Budget
  is about $2,000.
# Ringed and tagged "Suggested" in the network view. Calder is the near miss: it does
# computation only, so it is screened as a weak fit and left out of the outreach.
suggested_recipients: [northlake, ridgeline, calder]

steps:
  - id: ask
    title: Ask Claude
    act_as: alex
    body: >-
      As Alex Chen, a PhD student in the Henderson Lab, send the suggested message.
      Claude will likely search the network, screen the organizations it finds and draft
      a brief for the ones that look like a fit.
  - id: approve-outreach
    title: Approve the outreach
    act_as: alex
    body: >-
      Read the brief and each organization's ask: the shared brief gives the sample
      class and count, and each ask holds that organization's part and its limit. Edit
      either if you like. A near miss, for example Calder (computation only), is likely
      listed as a weak fit and left unticked.
    expect: {beat: outreach_approved}
  - id: seal-question
    title: Answer Ridgeline's question
    act_as: alex
    done_on: needs_human
    body: >-
      Ridgeline will likely need the holder's seal material before it can quote, and
      nobody wrote it down. When Henderson Lab's Claude can't find it in the lab's
      records, the question comes to you in the chat.
    expect: {beat: inline_question, org: ridgeline, member: alex}
  - id: seal-answer
    title: Release your answer
    act_as: alex
    body: >-
      Answer, for example, "Kalrez, please. The powders may sit under argon for a few
      weeks." Your answer goes back to this conversation only, and Ridgeline can then
      quote: about $325 at its list prices.
    expect: {beat: resolved, org: henderson, member: alex, action: approve}
  - id: northlake-routed
    title: Switch to Dr. Helen Ward
    act_as: helen
    done_on: needs_human
    body: >-
      Northlake's public XRD calendar is full until Nov 10, but Raj's note keeps a
      reserve block on Wed Nov 4. If Northlake's Claude drafts a yes that uses it, the
      sharing check will likely stop the draft, because reserve slots aren't in what
      Northlake shares, and it comes to you with that reason. Vantage, another lab, may
      also be asking Northlake; its thread can appear here too.
    expect: {beat: routed, org: northlake, member: helen}
  - id: northlake-approved
    title: Approve Northlake's answer
    act_as: helen
    body: >-
      See what Claude looked at, edit the draft if you like, and approve it. It goes to
      this conversation only; to share reserve slots from now on, you would edit what
      Northlake shares with Henderson Lab. Northlake will likely propose about $1,410,
      with results by Nov 5.
    expect: {beat: resolved, org: northlake, member: helen, action: approve}
  - id: go-ahead
    title: Say yes to both
    act_as: alex
    done_on: needs_human
    body: >-
      Back as Alex: before agreeing to a price, Henderson Lab's representative will
      likely check with you, for example once for Northlake's quote and once for
      Ridgeline's. Say yes if they look right.
    expect: {beat: inline_question, org: northlake, member: alex}
  - id: closed
    title: Both conversations close
    act_as: alex
    body: >-
      Once Northlake and Ridgeline confirm, each side closes with a summary for its own
      organization, and Claude sums up in the chat: about $1,735 in total if the quotes
      match the list prices, inside your budget. The network view shows the closed
      conversations, and Calder as Screened if it was left out.
    expect: {beat: closed, orgs: [northlake, ridgeline]}
  - id: what-it-saw
    title: See what Northlake's representative saw
    act_as: helen
    body: >-
      Open the request from the sidebar, then Details → What our representative saw:
      Northlake's summary, instructions and sharing description, and the answer you
      approved. Raj's note never reached it. Customize → Harmony → Sharing is where
      you'd change what Northlake shares.
  - id: big-run
    title: Switch to the big run
    body: Open the network view and switch it to the big run.

# What `harmony run` does in place of people (unless --interactive). A rule matches an
# escalation of `org` (the side that must decide), optionally only with `counterparty`,
# whoever it reached; `as` is who the story expects it to reach. Rules are used in
# order, each for one escalation: the seal question and the go-ahead on the Ridgeline
# conversation are two decisions. `text` replaces the draft's answer; without it the
# draft goes out as written. An escalation no rule is left for is approved as drafted.
humans:
  - org: henderson
    counterparty: ridgeline
    as: alex
    text: Kalrez, please. The powders may sit under argon for a few weeks.
  - org: northlake
    counterparty: henderson
    as: helen
  - org: henderson
    counterparty: northlake
    as: alex
    text: Yes, go ahead with Northlake.
  - org: henderson
    counterparty: ridgeline
    as: alex
    text: Yes, go ahead with Ridgeline.
