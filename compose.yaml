# Local stateful services only. The API, worker and Vite run on the host
# (`make dev`), so macOS-built .venv and node_modules never meet Linux containers.
# The containerized app for CI lives in compose.ci.yaml.
#
# Every port is published on 127.0.0.1 only: Temporal has no authentication, and the
# Postgres and MinIO credentials below are committed. Nothing on the network may reach
# them; the host's own processes use localhost.
name: harmony

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: harmony
      POSTGRES_DB: harmony
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony -d harmony"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  temporal:
    image: temporalio/temporal:1.9.1
    # The image runs as uid 1000, which can't write a fresh named volume.
    user: "0:0"
    command: >-
      server start-dev
      --ip 0.0.0.0
      --db-filename /data/temporal.db
      --search-attribute WorldId=Keyword
      --search-attribute OrgId=Keyword
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  # MinIO built from source (infra/minio, T10). Start with:
  #   docker compose --profile storage up -d --build minio
  minio:
    profiles: ["storage"]
    build:
      context: infra/minio
    image: harmony-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-harmony}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-harmony-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  temporal-data:
  minio-data:
