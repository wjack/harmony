# Harmony CI. Each job calls the same make target that `make ci-local` runs, so local
# and CI checks cannot drift. Render deploys only after these checks pass
# (auto_deploy_trigger = "checksPass").
#
# No job has a model API key or makes a model call: MODEL_MODE is scripted everywhere,
# and the tests point the Anthropic client at a local discard port. compose-smoke runs
# the production image with APP_ENV=ci (production refuses scripted mode) and the
# passcode gate on, using compose.ci.yaml's throwaway passcode.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MODEL_MODE: scripted
  UV_VERSION: "0.13.5"
  NODE_VERSION: "26"
  TERRAFORM_VERSION: "1.17.0"

jobs:
  python:
    name: python (ruff, pyright, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: harmony
          POSTGRES_PASSWORD: harmony
          POSTGRES_DB: harmony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmony -d harmony"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The postgres superuser, because the fixtures CREATE DATABASE per test.
      DATABASE_URL: postgresql://harmony:harmony@localhost:5432/harmony
      DATABASE_DIRECT_URL: postgresql://harmony:harmony@localhost:5432/harmony
      HARMONY_TEST_DB_PREFIX: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: ./.github/actions/setup-temporal-cli
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test

  web:
    name: web (typecheck, lint, test, build, API types)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Installs the pnpm version pinned by web/package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: make web-ci
      # schema.d.ts must match the API it was generated from (needs Python, no database).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: make gen-api-check

  compose-smoke:
    name: compose smoke (image, passcode gate, act-as, SSE resume, scripted turn, UI story)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checks run on the runner against the stack's published ports.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: ./.github/actions/setup-temporal-cli
      - run: uv sync --locked
      # The UI story drives the image's SPA with Playwright from the runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps --only-shell chromium
      - run: make compose-smoke

  terraform:
    name: terraform (fmt, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # Validation and mock-provider tests only: no backend, no credentials, never plan
      # or apply.
      - run: make tf-check
